# 架构门禁 baseline（违例冻结）配置
#
# allowStoreCreation=false 是刻意的：store 目录若意外丢失（误删、.gitignore 命中、CI 未 checkout
# 完整），ArchUnit 会「重新创建一个空 baseline 并通过」——那等于把全部存量违例一次性洗白，
# 是最隐蔽的门禁失效方式。设为 false 后这种情况会直接报错。
# 首次初始化 store 时显式覆盖：-Darchunit.freeze.store.default.allowStoreCreation=true
freeze.store.default.path=src/test/resources/archunit_store
freeze.store.default.allowStoreCreation=false

# allowStoreUpdate=true 让「已修复的违例」自动从 store 移除，实现存量只降不升。
# 新增违例仍会使测试失败（ArchUnit 不会把新违例写入 store）。
freeze.store.default.allowStoreUpdate=true
