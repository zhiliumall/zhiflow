name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # 全量编译 + 单元测试 + 架构门禁（zhiflow-arch-test）；需要真实数据库的集成测试默认跳过
      - name: Build and test
        run: ./mvnw -B -ntp verify

      - name: Fail if arch baseline drifted
        run: |
          if ! git diff --quiet -- zhiflow-arch-test/src/test/resources/archunit_store; then
            echo "::error::架构门禁的冻结库与提交内容不一致：在本地跑一遍 ./mvnw test -pl zhiflow-arch-test，提交更新后的 archunit_store。"
            git diff --stat -- zhiflow-arch-test/src/test/resources/archunit_store
            exit 1
          fi

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
