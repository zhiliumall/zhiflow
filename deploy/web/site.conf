# 站点公共部分（被 40-zhiflow-site.sh 生成的 server 块 include）：
#   /              H5 用户端（history 路由，找不到的路径回 index.html）
#   /admin/        管理后台（hash 路由）
#   /mallapi/      H5 接口 → 后端
#   /files/        上传文件 → 后端
#   /admin-api/    后台接口：去掉 /admin-api 前缀后转给后端。后台接口单独挂前缀，
#                  是因为后端的 /pay 等前缀与 H5 的页面路径（如 /pay/order/index）重名

root /usr/share/nginx/html/h5;
index index.html;
client_max_body_size 100m;
# 跳转地址只带路径：宿主机端口与容器端口不一致时，nginx 自己拼的绝对地址会丢端口
absolute_redirect off;
server_tokens off;

# 用 Docker 内置 DNS 按名字找后端，后端容器重建换了 IP 也不用重启 nginx
resolver 127.0.0.11 valid=10s ipv6=off;
set $zhiflow_app http://app:8080;

gzip on;
gzip_min_length 1024;
gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

# 容器健康检查
location = /healthz {
    access_log off;
    return 200 "ok";
}

# 入口页不缓存，前端重新构建后刷新即生效（其余静态文件名带 hash）
location = /index.html {
    add_header Cache-Control "no-cache";
}

location = /admin {
    return 301 /admin/;
}

location = /admin/index.html {
    root /usr/share/nginx/html;
    add_header Cache-Control "no-cache";
}

location ^~ /admin/ {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /admin/index.html;
}

location ~ ^/admin-api/(oauth2|auth|upms|mall|mallapi|pay|weixin|files)(/|$) {
    rewrite ^/admin-api(/.*)$ $1 break;
    proxy_pass $zhiflow_app;
    include /etc/nginx/zhiflow/proxy.conf;
}

# 不在上面白名单里的后端路径（如 /actuator）不对外
location /admin-api/ {
    return 404;
}

location ^~ /mallapi/ {
    proxy_pass $zhiflow_app;
    include /etc/nginx/zhiflow/proxy.conf;
}

location ^~ /files/ {
    proxy_pass $zhiflow_app;
    include /etc/nginx/zhiflow/proxy.conf;
}

location / {
    try_files $uri $uri/ /index.html;
}
